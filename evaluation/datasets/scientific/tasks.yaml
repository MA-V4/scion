tasks:
  - id: sci_001
    description: >
      Search arXiv for one paper about protein structure prediction
      and give its title and the year it was published.
    allowed_tools: [arxiv]
    expected:
      keywords: [protein, title]
      min_length: 50
    max_steps: 3
    evaluation_criteria: [tool_selection, groundedness]

  - id: sci_002
    description: >
      Calculate the molecular weight of water (H2O).
      Hydrogen atomic weight is 1.008, Oxygen atomic weight is 15.999.
    allowed_tools: [calculator]
    expected:
      contains_number: 18.015
      min_length: 30
    max_steps: 4
    evaluation_criteria: [tool_selection, final_answer_correctness]

  - id: sci_003
    description: >
      Calculate the energy in joules of a photon with wavelength 500nm.
      Use E = hc/wavelength where h = 6.626e-34 and c = 3e8.
      Express your answer in scientific notation.
    allowed_tools: [calculator]
    expected:
      keywords: ["3.98", "10"]
      min_length: 30
    max_steps: 5
    evaluation_criteria: [tool_selection, final_answer_correctness]
