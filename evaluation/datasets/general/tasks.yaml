tasks:
  - id: general_001
    description: >
      Calculate the compound interest on a principal of 10000 at 5% annual
      interest rate over 3 years. Use the formula A = P(1 + r)^t.
    allowed_tools: [calculator]
    expected:
      contains_number: 11576.25
      min_length: 50
    max_steps: 5
    evaluation_criteria: [tool_selection, final_answer_correctness]

  - id: general_002
    description: >
      Calculate the square root of 1764 and then calculate 42 squared.
      Confirm that both answers are consistent with each other.
    allowed_tools: [calculator]
    expected:
      contains_number: 42
      min_length: 50
    max_steps: 5
    evaluation_criteria: [tool_selection, final_answer_correctness]

  - id: general_003
    description: >
      Write a file called benchmark_test.txt with the content
      Scion evaluation platform test then read it back and confirm.
    allowed_tools: [filesystem]
    expected:
      keywords: [benchmark_test.txt, scion]
      min_length: 50
    max_steps: 6
    evaluation_criteria: [tool_selection, final_answer_correctness]
