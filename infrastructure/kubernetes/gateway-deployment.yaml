apiVersion: apps/v1
kind: Deployment
metadata:
  name: scion-gateway
  labels:
    app: scion-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scion-gateway
  template:
    metadata:
      labels:
        app: scion-gateway
    spec:
      containers:
        - name: gateway
          image: scion-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: scion-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: scion-gateway
spec:
  selector:
    app: scion-gateway
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scion-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scion-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
